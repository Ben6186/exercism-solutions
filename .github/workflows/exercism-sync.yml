name: Sync Exercism Solutions

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch: # Allows you to run it manually anytime with a single click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Exercism Tracks
        uses: exercism/github-action@v2
        with:
          token: ${{ secrets.EXERCISM_TOKEN }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "exercism-bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "sync: update exercism exercises"
          git push origin main
