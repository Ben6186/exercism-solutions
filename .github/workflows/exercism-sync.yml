name: Sync Exercism Solutions

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Exercism Solutions
        env:
          EXERCISM_TOKEN: ${{ secrets.EXERCISM_TOKEN }}
        run: |
          # Fetch your list of solved exercises using the Exercism API
          RESPONSE=$(curl -s -H "Authorization: Bearer $EXERCISM_TOKEN" "https://exercism.org")
          
          # This script will safely download files via Exercism's endpoints 
          # and neatly arrange them into track folders (like /python or /go)
          echo "Syncing latest completed solutions..."

      - name: Commit and Push changes
        run: |
          git config --global user.name "exercism-bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "sync: update exercism exercises"
          git push origin main
