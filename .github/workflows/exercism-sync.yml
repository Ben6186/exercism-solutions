name: Sync Exercism Solutions

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Exercism Solutions via Python
        env:
          EXERCISM_TOKEN: ${{ secrets.EXERCISM_TOKEN }}
        shell: python
        run: |
          import os
          import json
          import urllib.request
          from pathlib import Path

          token = os.environ.get("EXERCISM_TOKEN")
          if not token:
              print("CRITICAL ERROR: EXERCISM_TOKEN is missing!")
              exit(1)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }
          
          url = f"https://exercism.org/api/v2/solutions?token={token}"
          req = urllib.request.Request(url, headers=headers)

          try:
            with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())
          except Exception as e:
            print(f"Failed to fetch solutions from API: {e}")
            exit(1)

          solutions = data.get("solutions", [])
          print(f"Found {len(solutions)} total solutions on your account.")

          for sol in solutions:
              uuid = sol.get("uuid")
              # Process solutions that are completed, iterated, or published
              if sol.get("status") not in ["completed", "iterated", "published"]:
                  print(f"Skipping exercise {sol.get('exercise', {}).get('slug')} because status is: {sol.get('status')}")
                  continue

              track = sol.get("track", {}).get("slug")
              exercise = sol.get("exercise", {}).get("slug")
              print(f"Syncing: Track={track} | Exercise={exercise}")

              file_url = f"https://exercism.org/{uuid}/files?token={token}"
              file_req = urllib.request.Request(file_url, headers=headers)
              
              try:
                  with urllib.request.urlopen(file_req) as f_res:
                      file_data = json.loads(f_res.read().decode())
                  
                  paths = file_data.get("files", [])
                  for path_str in paths:
                      # Skip configuration metadata files
                      if path_str.startswith(".exercism"):
                          continue
                          
                      download_url = f"https://exercism.org/{uuid}/files/{path_str}?token={token}"
                      dl_req = urllib.request.Request(download_url, headers=headers)
                      
                      with urllib.request.urlopen(dl_req) as dl_res:
                          file_content = dl_res.read()
                      
                      local_path = Path(track) / exercise / path_str
                      local_path.parent.mkdir(parents=True, exist_ok=True)
                      local_path.write_bytes(file_content)
                      print(f" -> Downloaded: {local_path}")
              except Exception as e:
                  print(f" Error processing solution {uuid}: {e}")

      - name: Commit and Push changes
        run: |
          git config --global user.name "exercism-bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "sync: update completed exercism exercises"
          git push origin main
